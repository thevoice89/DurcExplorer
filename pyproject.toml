[project]
name = "pdnd-durc-batch"
version = "0.1.0"
description = "Controllo e download massivo dei DURC via e-service INPS/ANAC sul catalogo PDND."
requires-python = ">=3.11"
dependencies = [
    "PyJWT==2.13.0",
    "cryptography==49.0.0",
    "requests==2.34.2",
    "tenacity==9.1.4",
    "pyrate-limiter==4.4.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "SQLAlchemy==2.0.51",
]

[project.scripts]
durc-batch = "durc_batch.main:main"
durc-doctor = "durc_batch.doctor:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
